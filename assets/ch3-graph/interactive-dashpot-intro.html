<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mass-Spring-Dashpot System</title>
<style>
  body { margin: 0; padding: 10px; font-family: serif; background: transparent; overflow: hidden; }
  #title-display { text-align: center; font-size: 15px; font-family: serif; color: #2c3e50; margin-bottom: 8px; }
  #spring-panel { display: flex; flex-direction: column; align-items: center; }
  #spring-canvas { width: 420px; height: 200px; border: 1px solid #ccc; background: #f9f9f9; }
  #btnrow { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
  #playbtn { background: #1a5276; color: #fff; border: none; border-radius: 3px; padding: 6px 24px; font-family: serif; font-size: 14px; cursor: pointer; min-width: 85px; }
  #playbtn:hover { background: #154360; }
  #resetbtn { background: transparent; color: #1a5276; border: 1px solid #1a5276; border-radius: 3px; padding: 6px 14px; font-family: serif; font-size: 14px; cursor: pointer; }
  #resetbtn:hover { background: #eaf0fb; }
  #info { text-align: center; font-size: 13px; font-family: serif; color: #2c3e50; margin-top: 6px; min-height: 18px; }
</style>
</head>
<body>

<div id="title-display">A mass-spring-dashpot system</div>

<div id="spring-panel">
  <canvas id="spring-canvas" width="420" height="200"
    role="img"
    aria-label="Animated horizontal mass-spring-dashpot system. A block labeled m is attached to a left wall by two connectors: a coiled spring on the upper lane and a dashpot on the lower lane. When Play is pressed, the block oscillates left and right with amplitude that decays over time, eventually coming to rest at the equilibrium position x equals 0. Labels show x less than 0 for compressed, x equals 0 for equilibrium, and x greater than 0 for stretched."
    aria-describedby="info">
  </canvas>
</div>

<div id="btnrow">
  <button id="playbtn" aria-label="Play or pause the animation">&#9654; Play</button>
  <button id="resetbtn" aria-label="Reset the animation">Reset</button>
</div>

<div id="info" role="status" aria-live="polite">Press Play to watch the dashpot slow the mass down!</div>

<script>
  // ── Physics ────────────────────────────────────────────────
  // Damped: x(t) = e^(-p*t) * cos(omega*t), starts at x = +AMP (right)
  var p     = 0.18;
  var omega = 1.1;
  var tNow  = 0;
  var T_MAX = 22;
  var playing = false;
  var animInterval = null;

  // ── Canvas ─────────────────────────────────────────────────
  var canvas = document.getElementById('spring-canvas');
  var ctx    = canvas.getContext('2d');
  var CW = canvas.width;   // 420
  var CH = canvas.height;  // 200

  var wallX       = 40;
  var equilibriumX = 210;
  var blockW = 38, blockH = 50;  // taller block to span both lanes
  var AMP_PX = 110;
  var springCoils = 10;

  // Two horizontal lanes, vertically centered in canvas
  // Spring lane: upper;  Dashpot lane: lower
  var laneSpacing = 28;          // distance between the two lane centerlines
  var midY        = CH / 2 - 10; // canvas vertical midpoint
  var springY     = midY - laneSpacing / 2;   // upper lane centerline
  var dashpotY    = midY + laneSpacing / 2;   // lower lane centerline

  function xVal(t) {
    return Math.exp(-p * t) * Math.cos(omega * t);
  }

  // Draw the coil spring from wallX to blockLeftX along a given centerline y
  function drawSpring(blockLeftX, cy) {
    var springEndX = blockLeftX;
    var sLen = springEndX - wallX;
    if (sLen < 5) sLen = 5;
    var cw = sLen / (springCoils + 1);
    var ch = 11;
    ctx.strokeStyle = '#566573';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wallX, cy);
    ctx.lineTo(wallX + cw * 0.4, cy);
    for (var n = 0; n < springCoils; n++) {
      var bx = wallX + cw * (0.4 + n);
      ctx.lineTo(bx + cw * 0.3, cy - ch);
      ctx.lineTo(bx + cw * 0.8, cy + ch);
    }
    ctx.lineTo(springEndX, cy);
    ctx.stroke();
  }

  // Draw the dashpot from wallX to blockLeftX along centerline cy
  // Standard textbook symbol: two parallel lines (tube) with a filled rect (baffle/piston) in the middle
  function drawDashpot(blockLeftX, cy) {
    var endX = blockLeftX;
    var tubeH = 10;   // half-height of the dashpot tube
    var baffleW = 14; // width of the baffle (piston) box
    var baffleH = tubeH + 5; // baffle is slightly taller than tube

    // Baffle sits at the midpoint of the current tube length, moves with block
    var baffleX = wallX + (endX - wallX) * 0.50 - baffleW / 2;

    // Rod from wall to baffle left, and from baffle right to block
    // Left rod: wall to baffle
    ctx.strokeStyle = '#566573';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wallX, cy);
    ctx.lineTo(baffleX, cy);
    ctx.stroke();
    // Right rod: baffle right to block
    ctx.beginPath();
    ctx.moveTo(baffleX + baffleW, cy);
    ctx.lineTo(endX, cy);
    ctx.stroke();

    // Tube top and bottom lines (span entire dashpot length)
    var tubeLeft  = wallX + 10;
    var tubeRight = endX - 4;
    ctx.strokeStyle = '#566573';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tubeLeft, cy - tubeH);
    ctx.lineTo(tubeRight, cy - tubeH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tubeLeft, cy + tubeH);
    ctx.lineTo(tubeRight, cy + tubeH);
    ctx.stroke();
    // Tube left cap
    ctx.beginPath();
    ctx.moveTo(tubeLeft, cy - tubeH);
    ctx.lineTo(tubeLeft, cy + tubeH);
    ctx.stroke();

    // Baffle (filled box, fixed position)
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(baffleX, cy - baffleH, baffleW, baffleH * 2);
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(baffleX, cy - baffleH, baffleW, baffleH * 2);

    // Label "dashpot" below the tube, clear of the tube lines
    ctx.fillStyle = '#566573';
    ctx.font = 'italic 11px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('dashpot', wallX + (endX - wallX) / 2, cy + tubeH + 9);
  }

  function drawScene(blockX) {
    ctx.clearRect(0, 0, CW, CH);
    ctx.setLineDash([]);

    var blockLeft = blockX - blockW / 2;

    // ── Wall ──────────────────────────────────────────────────
    var wallTop    = springY - 40;
    var wallBottom = dashpotY + 40;
    ctx.fillStyle = '#bdc3c7';
    ctx.fillRect(wallX - 14, wallTop, 14, wallBottom - wallTop);
    ctx.strokeStyle = '#95a5a6';
    ctx.lineWidth = 1;
    for (var i = wallTop; i <= wallBottom; i += 12) {
      ctx.beginPath();
      ctx.moveTo(wallX - 14, i);
      ctx.lineTo(wallX - 2,  i - 10);
      ctx.stroke();
    }
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wallX, wallTop);
    ctx.lineTo(wallX, wallBottom);
    ctx.stroke();

    // ── Spring (upper lane) ───────────────────────────────────
    drawSpring(blockLeft, springY);

    // ── Dashpot (lower lane) ──────────────────────────────────
    drawDashpot(blockLeft, dashpotY);

    // ── Block (spans both lanes) ──────────────────────────────
    ctx.fillStyle = '#1a5276';
    ctx.fillRect(blockLeft, midY - blockH / 2, blockW, blockH);
    ctx.strokeStyle = '#154360';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(blockLeft, midY - blockH / 2, blockW, blockH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('m', blockX, midY);

    // ── Equilibrium line (solid, thin green) ──────────────────
    ctx.setLineDash([]);
    ctx.strokeStyle = '#145a32';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(equilibriumX, springY - 30);
    ctx.lineTo(equilibriumX, dashpotY + 30);
    ctx.stroke();

    // ── Bottom labels ─────────────────────────────────────────
    var labelY = CH - 24;
    var leftLabelX  = equilibriumX - AMP_PX * 0.7;
    var rightLabelX = equilibriumX + AMP_PX * 0.7;
    ctx.setLineDash([]);
    ctx.textBaseline = 'top';

    ctx.font = 'bold 11px serif';
    ctx.fillStyle = '#1a5276';
    ctx.textAlign = 'center';
    ctx.fillText('x < 0', leftLabelX, labelY);
    ctx.font = '10px serif';
    ctx.fillText('(compressed)', leftLabelX, labelY + 13);

    ctx.font = 'bold 11px serif';
    ctx.fillStyle = '#145a32';
    ctx.textAlign = 'center';
    ctx.fillText('x = 0', equilibriumX, labelY);
    ctx.font = '10px serif';
    ctx.fillText('(equilibrium)', equilibriumX, labelY + 13);

    ctx.font = 'bold 11px serif';
    ctx.fillStyle = '#922b21';
    ctx.textAlign = 'center';
    ctx.fillText('x > 0', rightLabelX, labelY);
    ctx.font = '10px serif';
    ctx.fillText('(stretched)', rightLabelX, labelY + 13);
  }

  // ── Animation control ──────────────────────────────────────
  function stopAnim() {
    if (animInterval) { clearInterval(animInterval); animInterval = null; }
    playing = false;
    document.getElementById('playbtn').innerHTML = '&#9654; Play';
  }

  function resetAll() {
    stopAnim();
    tNow = 0;
    drawScene(equilibriumX + AMP_PX);  // start displaced right
    document.getElementById('info').textContent = 'Press Play to watch the dashpot slow the mass down!';
    document.getElementById('playbtn').innerHTML = '&#9654; Play';
  }

  function startAnim() {
    stopAnim();
    if (tNow >= T_MAX) { tNow = 0; }
    playing = true;
    document.getElementById('playbtn').innerHTML = '&#9646;&#9646; Pause';
    document.getElementById('info').textContent = 'The dashpot resists motion. Watch the oscillations die out!';

    animInterval = setInterval(function() {
      if (tNow > T_MAX) {
        drawScene(equilibriumX);
        stopAnim();
        document.getElementById('info').textContent = 'The mass comes to rest at equilibrium.';
        return;
      }
      var xv = xVal(tNow);
      var clamped = Math.max(-1.0, Math.min(1.0, xv));
      drawScene(equilibriumX + clamped * AMP_PX);
      tNow += 0.04;
    }, 30);
  }

  document.getElementById('playbtn').addEventListener('click', function() {
    if (playing) { stopAnim(); } else { startAnim(); }
  });
  document.getElementById('resetbtn').addEventListener('click', resetAll);

  resetAll();
</script>
</body>
</html>
